# Projeto: Removedor de Fundo de Imagem
# Dois serviços: gradio-visao (frontend) e api-visao (backend).
# O frontend chama o backend via API REST (http://api-visao:8081/analisar).
services:
  gradio-visao:
    build:
      context: gradio-visao
      dockerfile: Dockerfile
    ports:
      - "7861:7861"
    depends_on:
      - api-visao
    restart: always

  api-visao:
    build:
      context: api-visao
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
